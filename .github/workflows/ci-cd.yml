name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - name: Reject missing model migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run ingestion tests
        run: python manage.py test ingestion --verbosity=2

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint report (existing frontend debt)
        continue-on-error: true
        run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Fast-forward and deploy the tested commit
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 55m
          script_stop: true
          script: |
            set -Eeuo pipefail
            cd /root/property_seeker

            test -n "${DEPLOY_SHA:-}"
            test -z "$(git status --porcelain)" || {
              echo "Refusing deployment: the VPS working tree has local changes."
              exit 1
            }

            git fetch origin master
            remote_sha="$(git rev-parse origin/master)"
            test "$remote_sha" = "$DEPLOY_SHA" || {
              echo "Refusing deployment: origin/master moved after this run started."
              exit 1
            }

            git merge-base --is-ancestor HEAD "$DEPLOY_SHA" || {
              echo "Refusing deployment: VPS has commits not present in the tested revision."
              exit 1
            }

            git merge --ff-only "$DEPLOY_SHA"

            # Clean up Docker build cache only to free space before building images.
            # IMPORTANT: Do NOT remove Docker volumes (PostgreSQL or others). The
            # allowed command is `docker builder prune -af` only; `docker system prune`
            # or manual removal of /var/lib/docker or /var/lib/containerd is forbidden.
            echo "Pruning Docker builder cache (docker builder prune -af) — will not remove volumes"
            docker builder prune -af || true

            DEPLOY_SHA="$DEPLOY_SHA" ./scripts/deploy-production.sh
