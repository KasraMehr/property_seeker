# ============================================================
# PRODUCTION DOCKER COMPOSE
# ============================================================

x-backend-build: &backend-build
  context: ./backend
  target: production

services:

  # ==========================================================
  # POSTGRESQL
  # ==========================================================

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5433}:5432"

    environment:
      POSTGRES_DB: ${DB_NAME:-property_seeker}
      POSTGRES_USER: ${DB_USER:-property_seeker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-property_seeker} -d ${DB_NAME:-property_seeker}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================================
  # REDIS
  # ==========================================================

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  # ==========================================================
  # DATABASE MIGRATION
  # ==========================================================

  migrate:
    build: *backend-build

    environment: &backend_environment

      # Django
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      DEBUG: "False"

      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env.production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env.production}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS in .env.production}

      # PostgreSQL
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-property_seeker}
      DB_USER: ${DB_USER:-property_seeker}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}

      # Redis
      REDIS_URL: redis://redis:6379/0

      CELERY_TIMEZONE: ${CELERY_TIMEZONE:-Asia/Tehran}

      DIVAR_REQUEST_INTERVAL_SECONDS: ${DIVAR_REQUEST_INTERVAL_SECONDS:-2.5}
      DIVAR_REQUIRE_AUTHENTICATED_SESSION: "true"

      # HTTPS
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-True}


    command:
        - sh
        - -c
        - |
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
    volumes:
        - static_volume:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


  # ==========================================================
  # DJANGO BACKEND
  # ==========================================================

  backend:
    build: *backend-build

    restart: unless-stopped

    environment: *backend_environment

    command:
      - gunicorn
      - amlak.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - ${GUNICORN_WORKERS:-3}
      - --timeout
      - ${GUNICORN_TIMEOUT:-60}
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"

    expose:
      - "8000"

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-H",
          "Host: dilanmelk.ir",
          "http://localhost:8000/admin/login/"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    depends_on:
      migrate:
        condition: service_completed_successfully


  # ==========================================================
  # CELERY WORKER
  # ==========================================================

  worker:
    build: *backend-build

    restart: unless-stopped

    environment: *backend_environment

    command:
      - celery
      - -A
      - amlak
      - worker
      - -Q
      - default
      - --concurrency=${CELERY_CONCURRENCY:-2}
      - --loglevel=INFO

    depends_on:
      migrate:
        condition: service_completed_successfully


  # ==========================================================
  # SCRAPER WORKER
  # ==========================================================

  scraper-worker:
    build: *backend-build

    restart: unless-stopped

    environment:
      <<: *backend_environment
      DIVAR_PROFILE_DIR: /app/divar-profile
      DIVAR_PHONE_INGESTION_ENABLED: "true"
      DIVAR_LOGIN_STEP_TIMEOUT_SECONDS: ${DIVAR_LOGIN_STEP_TIMEOUT_SECONDS:-90}
      DIVAR_LOGIN_OTP_TIMEOUT_SECONDS: ${DIVAR_LOGIN_OTP_TIMEOUT_SECONDS:-600}

    command:
      - celery
      - -A
      - amlak
      - worker
      - -Q
      - scraping
      - --concurrency=1
      - --loglevel=INFO

    shm_size: 1gb

    volumes:
      - divar_profile:/app/divar-profile

    depends_on:
      migrate:
        condition: service_completed_successfully


  # ==========================================================
  # CELERY BEAT
  # ==========================================================

  beat:
    build: *backend-build

    restart: unless-stopped

    environment: *backend_environment

    command:
      - celery
      - -A
      - amlak
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule

    depends_on:
      migrate:
        condition: service_completed_successfully


  # ==========================================================
  # FRONTEND + NGINX
  # ==========================================================

  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro

      - /etc/letsencrypt:/etc/letsencrypt:ro

      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      backend:
        condition: service_healthy


# ============================================================
# NAMED VOLUMES
# ============================================================

volumes:

  postgres_data:

  redis_data:

  static_volume:

  media_volume:

  divar_profile:
