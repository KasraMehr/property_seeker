# ==========================================================
# HTTP → HTTPS
# ==========================================================

server {
    listen 80;
    server_name dilanmelk.ir www.dilanmelk.ir 188.240.196.221;

    # تمدید بدون توقف کانتینر (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://dilanmelk.ir$request_uri;
    }
}


# ==========================================================
# HTTPS
# ==========================================================

server {
    listen 443 ssl;
    http2 on;

    server_name dilanmelk.ir www.dilanmelk.ir;

    client_max_body_size 50M;


    # ----------------------------------------------------------
    # SSL
    # ----------------------------------------------------------

    ssl_certificate     /etc/letsencrypt/live/dilanmelk.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dilanmelk.ir/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — بعد از پایدار شدن HTTPS فعال شود
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


    # ----------------------------------------------------------
    # REACT / VITE
    # ----------------------------------------------------------

    location / {
        root /usr/share/nginx/html;

        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        root /usr/share/nginx/html;

        add_header Cache-Control "no-cache, must-revalidate";
    }


    # ----------------------------------------------------------
    # DJANGO API
    # ----------------------------------------------------------

    location /api/ {
        proxy_pass http://backend:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # ----------------------------------------------------------
    # DJANGO ADMIN
    # ----------------------------------------------------------

    location /admin/ {
        proxy_pass http://backend:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # ----------------------------------------------------------
    # DJANGO STATIC
    # ----------------------------------------------------------

    location /static/ {
        alias /app/staticfiles/;

        expires 30d;
        add_header Cache-Control "public, immutable";
    }


    # ----------------------------------------------------------
    # DJANGO MEDIA
    # ----------------------------------------------------------

    location /media/ {
        alias /app/media/;

        expires 7d;
        add_header Cache-Control "public";
    }
}
